[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zhres"
version = "1.0.0"
description = "Windows 静态资源汉化工具：对 PE 文件（exe/dll）中的界面资源做 提取 → 翻译 → 回写"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhres" }]
keywords = ["localization", "l10n", "resource", "hacker", "translate"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Localization",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
zhres = "zhres.cli:main"
zhres-gui = "zhres.gui:main"

[project.urls]
Homepage = "https://github.com/Mstars/zhres"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 需要真实 LLM API key 的在线测试（默认跳过）",
]
